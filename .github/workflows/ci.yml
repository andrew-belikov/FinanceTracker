name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      APP_ENV_FILE: ${{ github.workspace }}/.env

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/bot.txt
            requirements/dev.txt
            requirements/reporter.txt
            requirements/tracker.txt

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r requirements/bot.txt -r requirements/reporter.txt -r requirements/tracker.txt

      - name: Install hash-locked quality dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Install FinanceTracker package
        run: python -m pip install --no-deps .

      - name: Prepare CI environment file
        run: |
          test -n "$APP_ENV_FILE"
          test "$APP_ENV_FILE" = "$GITHUB_WORKSPACE/.env"
          install -m 600 .env.example "$APP_ENV_FILE"
          test -f "$APP_ENV_FILE"
          test ! -L "$APP_ENV_FILE"
          test -r "$APP_ENV_FILE"
          test "$(stat -c '%a' "$APP_ENV_FILE")" = "600"
          test "$(stat -c '%u' "$APP_ENV_FILE")" = "$(id -u)"

      - name: Run compileall
        run: python -m compileall src

      - name: Run Ruff correctness checks
        run: python -m ruff check src tests --select E9,F

      - name: Run Bandit medium-and-higher security checks
        run: python -m bandit -r src -ll -q

      - name: Run strict type checks for public boundaries
        run: python -m mypy

      - name: Prevent growth of legacy multi-purpose modules
        run: python scripts/check_module_size.py

      - name: Run unit tests with production coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          python -m coverage report

      - name: Run workflow contract checks
        run: python -m unittest tests.test_workflow_contract tests.test_dependency_lock_contract tests.test_compose_healthchecks tests.test_proxy_smoke_contract tests.test_workflow_readiness tests.test_compose_env_contract

      - name: Verify Compose env interpolation
        run: python scripts/verify_compose_env.py

      - name: Run secret scan
        run: python scripts/scan_secrets.py --history

      - name: Validate docker compose configuration
        env:
          REPORTER_SERVICE_KEY: ci_reporter_service_key
        run: docker compose --env-file "$APP_ENV_FILE" config --quiet

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: financetracker_ci
          POSTGRES_USER: financetracker_ci
          POSTGRES_PASSWORD: financetracker_ci
        options: >-
          --health-cmd "pg_isready -U financetracker_ci -d financetracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      FINANCETRACKER_POSTGRES_INTEGRATION: "1"
      DB_PASSWORD: financetracker_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: financetracker_ci
      DB_USER: financetracker_ci
      TIMEZONE: Europe/Moscow
      TINVEST_API_TOKEN: ci_test_token
      TELEGRAM_BOT_TOKEN: ci_test_token
      ALLOWED_USER_IDS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/bot.txt
            requirements/reporter.txt
            requirements/tracker.txt

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r requirements/bot.txt -r requirements/reporter.txt -r requirements/tracker.txt

      - name: Install FinanceTracker package
        run: python -m pip install --no-deps .

      - name: Apply, repeat and verify PostgreSQL migrations
        run: python -m unittest tests.test_postgresql_integration

  container-smoke:
    runs-on: ubuntu-latest
    env:
      APP_ENV_FILE: ${{ github.workspace }}/.env
      REPORTER_SERVICE_KEY: ci_reporter_service_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare synthetic Compose environment
        run: |
          install -m 600 .env.example "$APP_ENV_FILE"
          test -f "$APP_ENV_FILE"
          test ! -L "$APP_ENV_FILE"

      - name: Build all first-party images
        run: docker compose --env-file "$APP_ENV_FILE" -f compose.yml -f compose.ci.yml build

      - name: Run migration Compose smoke
        run: |
          docker compose --env-file "$APP_ENV_FILE" -f compose.yml -f compose.ci.yml up --abort-on-container-exit --exit-code-from migrate migrate
          docker compose --env-file "$APP_ENV_FILE" -f compose.yml -f compose.ci.yml up -d db
          docker compose --env-file "$APP_ENV_FILE" -f compose.yml -f compose.ci.yml run --rm migrate --check
          docker compose --env-file "$APP_ENV_FILE" -f compose.yml -f compose.ci.yml down
