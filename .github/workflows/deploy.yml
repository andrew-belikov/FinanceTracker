name: Deploy FinanceTracker

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    concurrency:
      group: financetracker-deploy
      cancel-in-progress: false

    runs-on:
      - self-hosted
      - linux
      - x64
      - homeserver
      - financetracker

    env:
      PROJECT_DIR: /home/andrey/projects/FinanceTracker
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      COMPOSE_PROJECT_NAME: financetracker

    steps:
      - name: Verify successful CI identity
        run: |
          test "${{ github.event.workflow_run.name }}" = "CI"
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          test "${{ github.event.workflow_run.event }}" = "push"
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test -n "$CI_RUN_ID"
          printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Create clean disposable exact-SHA checkout
        run: |
          deploy_dir="$(mktemp -d /tmp/financetracker-deploy.XXXXXXXX)"
          printf 'DEPLOY_DIR=%s\n' "$deploy_dir" >> "$GITHUB_ENV"
          git clone --no-hardlinks --no-checkout https://github.com/andrew-belikov/FinanceTracker.git "$deploy_dir"
          git -C "$deploy_dir" fetch origin "$DEPLOY_SHA"
          git -C "$deploy_dir" checkout --detach "$DEPLOY_SHA"
          test "$(git -C "$deploy_dir" rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git -C "$deploy_dir" status --porcelain --untracked-files=all)"
          printf 'APP_ENV_FILE=%s/.env\n' "$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Resolve Compose files for optional Ollama
        run: |
          test "${APP_ENV_FILE:-}" = "$PROJECT_DIR/.env"
          test -f "$APP_ENV_FILE"
          test ! -L "$APP_ENV_FILE"
          test -r "$APP_ENV_FILE"
          test "$(stat -c '%a' "$APP_ENV_FILE")" = "600"
          test "$(stat -c '%u' "$APP_ENV_FILE")" = "$(id -u)"
          # The application and compose file default this optional integration to false.
          # Keep legacy production .env files deployable without enabling Ollama implicitly.
          OLLAMA_ENABLED="$(sed -nE 's/^[[:space:]]*OLLAMA_ENABLED[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' "$APP_ENV_FILE" | tail -n 1)"
          OLLAMA_ENABLED="${OLLAMA_ENABLED:-false}"
          printf 'OLLAMA_ENABLED=%s\n' "$OLLAMA_ENABLED" >> "$GITHUB_ENV"
          if test "$OLLAMA_ENABLED" = "true"; then
            printf 'COMPOSE_FILE=%s/compose.yml:%s/compose.ollama.yml\n' "$DEPLOY_DIR" "$DEPLOY_DIR" >> "$GITHUB_ENV"
          else
            printf 'COMPOSE_FILE=%s/compose.yml\n' "$DEPLOY_DIR" >> "$GITHUB_ENV"
          fi

      - name: Run exact-SHA pre-deploy checks
        run: |
          cd "$DEPLOY_DIR"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -m compileall src
          docker compose --env-file "$APP_ENV_FILE" config --quiet

      - name: Prepare optional integration network
        run: |
          if test "$OLLAMA_ENABLED" = "true"; then
            docker network inspect localllm_localllm >/dev/null 2>&1 \
              || docker network create localllm_localllm
          fi

      - name: Build exact-SHA images
        env:
          BOT_IMAGE: financetracker-bot:git-${{ github.event.workflow_run.head_sha }}
          TRACKER_IMAGE: financetracker-tracker:git-${{ github.event.workflow_run.head_sha }}
          REPORTER_IMAGE: financetracker-reporter:git-${{ github.event.workflow_run.head_sha }}
          XRAY_CLIENT_IMAGE: financetracker-xray-client:git-${{ github.event.workflow_run.head_sha }}
        run: |
          cd "$DEPLOY_DIR"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          docker compose --env-file "$APP_ENV_FILE" build
          bot_image_id="$(docker image inspect --format '{{.Id}}' "$BOT_IMAGE")"
          tracker_image_id="$(docker image inspect --format '{{.Id}}' "$TRACKER_IMAGE")"
          reporter_image_id="$(docker image inspect --format '{{.Id}}' "$REPORTER_IMAGE")"
          xray_client_image_id="$(docker image inspect --format '{{.Id}}' "$XRAY_CLIENT_IMAGE")"
          for image_id in "$bot_image_id" "$tracker_image_id" "$reporter_image_id" "$xray_client_image_id"; do
            printf '%s' "$image_id" | grep -Eq '^sha256:[0-9a-f]{64}$'
          done
          {
            printf 'EXPECTED_BOT_IMAGE_ID=%s\n' "$bot_image_id"
            printf 'EXPECTED_TRACKER_IMAGE_ID=%s\n' "$tracker_image_id"
            printf 'EXPECTED_REPORTER_IMAGE_ID=%s\n' "$reporter_image_id"
            printf 'EXPECTED_XRAY_CLIENT_IMAGE_ID=%s\n' "$xray_client_image_id"
          } >> "$GITHUB_ENV"

      - name: Apply exact-SHA deploy
        env:
          BOT_IMAGE: financetracker-bot:git-${{ github.event.workflow_run.head_sha }}
          TRACKER_IMAGE: financetracker-tracker:git-${{ github.event.workflow_run.head_sha }}
          REPORTER_IMAGE: financetracker-reporter:git-${{ github.event.workflow_run.head_sha }}
          XRAY_CLIENT_IMAGE: financetracker-xray-client:git-${{ github.event.workflow_run.head_sha }}
          BACKUP_DIR: ${{ vars.FINANCETRACKER_BACKUP_DIR }}
        run: |
          cd "$DEPLOY_DIR"
          bash scripts/deploy_services.sh

      - name: Record deployed source and image identity
        env:
          BOT_IMAGE: financetracker-bot:git-${{ github.event.workflow_run.head_sha }}
          TRACKER_IMAGE: financetracker-tracker:git-${{ github.event.workflow_run.head_sha }}
          REPORTER_IMAGE: financetracker-reporter:git-${{ github.event.workflow_run.head_sha }}
          XRAY_CLIENT_IMAGE: financetracker-xray-client:git-${{ github.event.workflow_run.head_sha }}
        run: |
          {
            printf '## FinanceTracker deploy identity\n\n'
            printf -- '- CI run: `%s`\n' "$CI_RUN_ID"
            printf -- '- Source SHA: `%s`\n' "$DEPLOY_SHA"
            printf -- '- Database image `%s`: `%s`\n' "$ACTUAL_DB_IMAGE_REF" "$ACTUAL_DB_IMAGE_ID"
            printf -- '- Image `%s`: `%s`\n' "$BOT_IMAGE" "$ACTUAL_BOT_IMAGE_ID"
            printf -- '- Image `%s`: `%s`\n' "$TRACKER_IMAGE" "$ACTUAL_TRACKER_IMAGE_ID"
            printf -- '- Image `%s`: `%s`\n' "$REPORTER_IMAGE" "$ACTUAL_REPORTER_IMAGE_ID"
            printf -- '- Image `%s`: `%s`\n' "$XRAY_CLIENT_IMAGE" "$ACTUAL_XRAY_CLIENT_IMAGE_ID"
            printf -- '- Migrate image: `%s`\n' "$ACTUAL_MIGRATE_IMAGE_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show post-deploy status
        if: ${{ always() }}
        run: |
          if test -n "${DEPLOY_DIR:-}" && test -d "$DEPLOY_DIR"; then
            cd "$DEPLOY_DIR"
            docker compose --env-file "$APP_ENV_FILE" ps --all
          fi

      - name: Remove disposable checkout
        if: ${{ always() }}
        run: |
          case "${DEPLOY_DIR:-}" in
            /tmp/financetracker-deploy.*) rm -rf -- "$DEPLOY_DIR" ;;
            "") ;;
            *) echo "refusing to remove unexpected deploy path" >&2; exit 1 ;;
          esac
